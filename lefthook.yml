pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      exclude:
        # Standalone app with its own lockfile and CI; oxlint ignores it, and passing
        # only ignored paths makes oxlint exit non-zero on "no files found".
        - "slp-blueprint-site/**"
      run: npm run lint -- {staged_files}
    - name: typecheck
      run: npm run typecheck
